name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24
          cache: true

      - name: Typecheck
        run: vp run typecheck

      - name: Lint
        run: vp check

      - name: Test
        run: vp test run --passWithNoTests

      - name: Build
        run: vp build

      - name: Build Docker image
        run: docker build . --tag coral-module:ci
